spring.application.name=payment-service
server.port=${SERVER_PORT:8083}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/swiftride_payment}
spring.data.mongodb.auto-index-creation=true

swift-ride.payment.vnpay.tmn-code=${VNPAY_TMN_CODE:}
swift-ride.payment.vnpay.hash-secret=${VNPAY_HASH_SECRET:}
swift-ride.payment.vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
swift-ride.payment.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8083/payments/vnpay/return}
swift-ride.payment.vnpay.web-return-url=${WEB_RETURN_URL:http://localhost:3000/payment-result}

swift-ride.messaging.rabbitmq.enabled=${RABBITMQ_ENABLED:false}
swift-ride.messaging.ride-completed-queue=${RIDE_COMPLETED_QUEUE:swiftride.trip.ride-completed}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.publisher-confirm-type=correlated
swift-ride.messaging.outbox-poll-ms=${OUTBOX_POLL_MS:1000}


server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: matching-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true


server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: matching-service

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    virtual-host: /

  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE}

jwt:
  # Set JWT_SECRET_BASE64 to the Base64 encoding of a random key with at least 32 bytes.
  secret-base64: ${JWT_SECRET_BASE64}
  expiration-seconds: ${JWT_EXPIRATION_SECONDS:3600}

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
